# ─── HikariCP Connection Pool (Issue 2.7) ────────────────────────────────────
# Default Spring Boot pool size is 10 — too low for concurrent transaction load.
# With 3 shards and concurrent requests, 50 max connections is more appropriate.
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# Warn if a connection is held longer than 60s (likely a slow query or bug)
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=KerosenePgPool

# ─── Blockchain Monitor Adaptive Interval (Issue 2.3) ────────────────────────
blockchain.monitor.interval.min=10000
blockchain.monitor.interval.max=120000

# ─── WebAuthn Relying Party ───────────────────────────────────────────────────
# The app passkey is an Ed25519 device key, not browser WebAuthn.
# Keep the RP ID stable so local credentials survive localhost/onion changes.
webauthn.rp.id=${WEBAUTHN_RP_ID:kerosene-device}
webauthn.relying-party-id=${WEBAUTHN_RP_ID:kerosene-device}
webauthn.rp.name=${WEBAUTHN_RP_NAME:Kerosene}
webauthn.origins=${WEBAUTHN_ORIGINS:android:apk-key-hash:kerosene,http://localhost:3000,http://localhost:3001,http://localhost:8080,http://localhost:8081,http://localhost:8082,http://localhost:30080,http://localhost:30082,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:8080,http://127.0.0.1:8081,http://127.0.0.1:8082,http://127.0.0.1:30080,http://127.0.0.1:30082}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:8080,http://localhost:8081,http://localhost:8082,http://localhost:30080,http://localhost:30082,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:8080,http://127.0.0.1:8081,http://127.0.0.1:8082,http://127.0.0.1:30080,http://127.0.0.1:30082}
