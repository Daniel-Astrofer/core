name: Core CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  compatibility:
    uses: Daniel-Astrofer/.github/.github/workflows/compatibility-ci.yml@2552ff2125c2d72accebe93804b8e139a52ded13
    with:
      component: core

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: kerosene-core
      - uses: actions/checkout@v4
        with:
          repository: Daniel-Astrofer/kerosene-contracts
          path: kerosene-contracts
      - uses: actions/checkout@v4
        with:
          repository: Daniel-Astrofer/kerosene-shared
          path: kerosene-shared
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Auth gateway
        working-directory: kerosene-core
        run: ./gradlew check --no-daemon

  security:
    uses: Daniel-Astrofer/.github/.github/workflows/security-scan.yml@2552ff2125c2d72accebe93804b8e139a52ded13
